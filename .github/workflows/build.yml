name: Build APK Cloud Studio

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Nom de l application'
        required: true
        default: 'Mon Application'
      package_id:
        description: 'ID Paquet'
        required: true
        default: 'com.monnom.app'
      version_name:
        description: 'Nom version'
        required: true
        default: '1.0.0'
      version_code:
        description: 'Code version'
        required: true
        default: '1'
      permissions:
        description: 'Permissions'
        required: true
        default: 'INTERNET'
      enable_mesh:
        description: 'Activer Bluetooth + Wi-Fi Direct Mesh'
        required: true
        default: 'true'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code HTML
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Installer Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Générer le projet Android
        env:
          APP_NAME: ${{ inputs.app_name }}
          PKG_ID: ${{ inputs.package_id }}
          VER_NAME: ${{ inputs.version_name }}
          VER_CODE: ${{ inputs.version_code }}
          PERMS: ${{ inputs.permissions }}
          ENABLE_MESH: ${{ inputs.enable_mesh }}
        run: |
          python3 - << 'PYEOF'
          import os, shutil, xml.sax.saxutils as sax

          app_name = os.environ["APP_NAME"].strip() or "Mon App"
          pkg = os.environ["PKG_ID"].strip() or "com.studio.app"
          ver_name = os.environ["VER_NAME"].strip() or "1.0.0"
          ver_code = os.environ["VER_CODE"].strip() or "1"
          perms = [p.strip() for p in os.environ["PERMS"].split(",") if p.strip()]
          enable_mesh = os.environ["ENABLE_MESH"].strip().lower() == "true"

          pkg_path = os.path.join("app", "src", "main", "java", *pkg.split("."))
          os.makedirs(pkg_path, exist_ok=True)
          os.makedirs("app/src/main/assets", exist_ok=True)
          os.makedirs("app/src/main/res/values", exist_ok=True)

          if os.path.exists("src/index.html"):
              shutil.copyfile("src/index.html", "app/src/main/assets/index.html")
          else:
              with open("app/src/main/assets/index.html", "w") as f:
                  f.write("<html><body><h1>Aucun fichier src/index.html</h1></body></html>")

          with open("gradle.properties", "w") as f:
              f.write("org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8\nandroid.useAndroidX=true\nkotlin.code.style=official\n")

          with open("settings.gradle", "w") as f:
              f.write("""pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "CloudStudioApp"
          include(":app")
          """)

          with open("build.gradle", "w") as f:
              f.write("""plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '2.4.20' apply false
          }
          """)

          mesh_dep = "implementation 'com.google.android.gms:play-services-nearby:19.5.1'" if enable_mesh else ""
          app_gradle = """plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace '__PKG__'
              compileSdk 35
              defaultConfig {
                  applicationId '__PKG__'
                  minSdk 24
                  targetSdk 35
                  versionCode __VCODE__
                  versionName '__VNAME__'
              }
              buildTypes {
                  release { minifyEnabled false }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          kotlin {
              compilerOptions {
                  jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.7.0'
              __MESH_DEP__
          }
          """.replace("__PKG__", pkg).replace("__VCODE__", ver_code).replace("__VNAME__", ver_name).replace("__MESH_DEP__", mesh_dep)

          with open("app/build.gradle", "w") as f:
              f.write(app_gradle)

          with open("app/src/main/res/values/strings.xml", "w") as f:
              f.write(f'<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <string name="app_name">{sax.escape(app_name)}</string>\n</resources>\n')

          perm_lines = [
              '    <uses-permission android:name="android.permission.INTERNET" />',
              '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />'
          ]
          if "CAMERA" in perms:
              perm_lines.append('    <uses-permission android:name="android.permission.CAMERA" />')
          if "RECORD_AUDIO" in perms:
              perm_lines.append('    <uses-permission android:name="android.permission.RECORD_AUDIO" />')
          if "ACCESS_FINE_LOCATION" in perms:
              perm_lines.append('    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />')
              perm_lines.append('    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />')
          if "WRITE_EXTERNAL_STORAGE" in perms:
              perm_lines.append('    <uses-permission android:maxSdkVersion="32" android:name="android.permission.READ_EXTERNAL_STORAGE" />')
              perm_lines.append('    <uses-permission android:maxSdkVersion="29" android:name="android.permission.WRITE_EXTERNAL_STORAGE" />')
              perm_lines.append('    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />')
          if enable_mesh:
              perm_lines.extend([
                  '    <uses-permission android:maxSdkVersion="32" android:name="android.permission.ACCESS_WIFI_STATE" />',
                  '    <uses-permission android:maxSdkVersion="32" android:name="android.permission.CHANGE_WIFI_STATE" />',
                  '    <uses-permission android:maxSdkVersion="30" android:name="android.permission.BLUETOOTH" />',
                  '    <uses-permission android:maxSdkVersion="30" android:name="android.permission.BLUETOOTH_ADMIN" />',
                  '    <uses-permission android:maxSdkVersion="32" android:name="android.permission.ACCESS_COARSE_LOCATION" />',
                  '    <uses-permission android:minSdkVersion="29" android:maxSdkVersion="32" android:name="android.permission.ACCESS_FINE_LOCATION" />',
                  '    <uses-permission android:minSdkVersion="31" android:name="android.permission.BLUETOOTH_ADVERTISE" />',
                  '    <uses-permission android:minSdkVersion="31" android:name="android.permission.BLUETOOTH_CONNECT" />',
                  '    <uses-permission android:minSdkVersion="31" android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />',
                  '    <uses-permission android:minSdkVersion="33" android:name="android.permission.NEARBY_WIFI_DEVICES" android:usesPermissionFlags="neverForLocation" />'
              ])

          perm_block = "\n".join(dict.fromkeys(perm_lines))

          manifest = f"""<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
          {perm_block}
              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          """
          with open("app/src/main/AndroidManifest.xml", "w") as f:
              f.write(manifest)

          if enable_mesh:
              kt_code = r"""package __PKG__

          import android.Manifest
          import android.annotation.SuppressLint
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.ConnectivityManager
          import android.net.NetworkCapabilities
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.webkit.*
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.content.ContextCompat
          import com.google.android.gms.nearby.Nearby
          import com.google.android.gms.nearby.connection.*
          import org.json.JSONObject
          import java.nio.charset.StandardCharsets
          import java.util.UUID

          class MainActivity : AppCompatActivity() {
              private lateinit var webView: WebView
              private lateinit var connectionsClient: ConnectionsClient
              private val SERVICE_ID = "__PKG__.MESH_V1"
              private val myNodeName = "Node_" + UUID.randomUUID().toString().substring(0, 6)
              private val connectedEndpoints = mutableSetOf<String>()
              private val pendingEndpoints = mutableSetOf<String>()
              private var filePathCallback: ValueCallback<Array<Uri>>? = null

              private val fileChooserLauncher = registerForActivityResult(
                  ActivityResultContracts.StartActivityForResult()
              ) { result ->
                  val uris = if (result.resultCode == RESULT_OK && result.data != null) {
                      WebChromeClient.FileChooserParams.parseResult(result.resultCode, result.data)
                  } else null
                  filePathCallback?.onReceiveValue(uris)
                  filePathCallback = null
              }

              private val permissionsLauncher = registerForActivityResult(
                  ActivityResultContracts.RequestMultiplePermissions()
              ) { grants ->
                  if (grants.values.all { it }) startMeshNetwork()
              }

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  webView = WebView(this)
                  setContentView(webView)
                  connectionsClient = Nearby.getConnectionsClient(this)

                  webView.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      allowFileAccess = true
                  }
                  webView.webViewClient = WebViewClient()
                  webView.webChromeClient = object : WebChromeClient() {
                      override fun onShowFileChooser(v: WebView?, cb: ValueCallback<Array<Uri>>?, p: FileChooserParams?): Boolean {
                          filePathCallback?.onReceiveValue(null)
                          filePathCallback = cb
                          val intent = p?.createIntent() ?: Intent(Intent.ACTION_GET_CONTENT).apply { type = "image/*" }
                          fileChooserLauncher.launch(intent)
                          return true
                      }
                  }
                  webView.addJavascriptInterface(WebAppBridge(), "AndroidMesh")
                  webView.loadUrl("file:///android_asset/index.html")
                  requestRequiredPermissions()
              }

              private fun requestRequiredPermissions() {
                  val needed = mutableListOf<String>()
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      needed += Manifest.permission.NEARBY_WIFI_DEVICES
                  } else {
                      needed += Manifest.permission.ACCESS_FINE_LOCATION
                  }
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                      needed += Manifest.permission.BLUETOOTH_ADVERTISE
                      needed += Manifest.permission.BLUETOOTH_CONNECT
                      needed += Manifest.permission.BLUETOOTH_SCAN
                  }
                  val missing = needed.filter { ContextCompat.checkSelfPermission(this, it) != PackageManager.PERMISSION_GRANTED }
                  if (missing.isEmpty()) startMeshNetwork() else permissionsLauncher.launch(missing.toTypedArray())
              }

              private fun startMeshNetwork() {
                  connectionsClient.startAdvertising(myNodeName, SERVICE_ID, connCallback, AdvertisingOptions.Builder().setStrategy(Strategy.P2P_CLUSTER).build())
                  connectionsClient.startDiscovery(SERVICE_ID, discCallback, DiscoveryOptions.Builder().setStrategy(Strategy.P2P_CLUSTER).build())
              }

              private val discCallback = object : EndpointDiscoveryCallback() {
                  override fun onEndpointFound(id: String, info: DiscoveredEndpointInfo) {
                      if (!connectedEndpoints.contains(id) && !pendingEndpoints.contains(id)) {
                          pendingEndpoints.add(id)
                          connectionsClient.requestConnection(myNodeName, id, connCallback).addOnFailureListener { pendingEndpoints.remove(id) }
                      }
                  }
                  override fun onEndpointLost(id: String) {}
              }

              private val connCallback = object : ConnectionLifecycleCallback() {
                  override fun onConnectionInitiated(id: String, info: ConnectionInfo) {
                      connectionsClient.acceptConnection(id, payloadCallback)
                  }
                  override fun onConnectionResult(id: String, res: ConnectionResolution) {
                      pendingEndpoints.remove(id)
                      if (res.status.isSuccess) {
                          connectedEndpoints.add(id)
                          notifyPeers()
                      }
                  }
                  override fun onDisconnected(id: String) {
                      connectedEndpoints.remove(id)
                      notifyPeers()
                  }
              }

              private val payloadCallback = object : PayloadCallback() {
                  override fun onPayloadReceived(id: String, payload: Payload) {
                      if (payload.type == Payload.Type.BYTES) {
                          val json = String(payload.asBytes() ?: return, StandardCharsets.UTF_8)
                          val q = JSONObject.quote(json)
                          runOnUiThread { webView.evaluateJavascript("window.onPacketReceived && window.onPacketReceived($q);", null) }
                      }
                  }
                  override fun onPayloadTransferUpdate(id: String, u: PayloadTransferUpdate) {}
              }

              private fun notifyPeers() {
                  val c = connectedEndpoints.size
                  runOnUiThread { webView.evaluateJavascript("window.onPeersChanged && window.onPeersChanged($c);", null) }
              }

              inner class WebAppBridge {
                  @JavascriptInterface fun broadcastPacket(json: String) {
                      if (connectedEndpoints.isEmpty()) return
                      connectionsClient.sendPayload(connectedEndpoints.toList(), Payload.fromBytes(json.toByteArray(StandardCharsets.UTF_8)))
                  }
                  @JavascriptInterface fun getPeersCount(): Int = connectedEndpoints.size
                  @JavascriptInterface fun hasInternet(): Boolean {
                      val cm = getSystemService(Context.CONNECTIVITY_SERVICE) as ConnectivityManager
                      val net = cm.activeNetwork ?: return false
                      val caps = cm.getNetworkCapabilities(net) ?: return false
                      return caps.hasCapability(NetworkCapabilities.NET_CAPABILITY_INTERNET)
                  }
              }

              override fun onDestroy() {
                  connectionsClient.stopAllEndpoints()
                  connectionsClient.stopAdvertising()
                  connectionsClient.stopDiscovery()
                  super.onDestroy()
              }
          }
          """.replace("__PKG__", pkg)
          else:
              kt_code = r"""package __PKG__

          import android.annotation.SuppressLint
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.webkit.*
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              private lateinit var webView: WebView
              private var filePathCallback: ValueCallback<Array<Uri>>? = null

              private val fileChooserLauncher = registerForActivityResult(
                  ActivityResultContracts.StartActivityForResult()
              ) { result ->
                  val uris = if (result.resultCode == RESULT_OK && result.data != null) {
                      WebChromeClient.FileChooserParams.parseResult(result.resultCode, result.data)
                  } else null
                  filePathCallback?.onReceiveValue(uris)
                  filePathCallback = null
              }

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  webView = WebView(this)
                  setContentView(webView)
                  webView.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      allowFileAccess = true
                  }
                  webView.webViewClient = WebViewClient()
                  webView.webChromeClient = object : WebChromeClient() {
                      override fun onShowFileChooser(v: WebView?, cb: ValueCallback<Array<Uri>>?, p: FileChooserParams?): Boolean {
                          filePathCallback?.onReceiveValue(null)
                          filePathCallback = cb
                          val intent = p?.createIntent() ?: Intent(Intent.ACTION_GET_CONTENT).apply { type = "image/*" }
                          fileChooserLauncher.launch(intent)
                          return true
                      }
                  }
                  webView.loadUrl("file:///android_asset/index.html")
              }
          }
          """.replace("__PKG__", pkg)

          with open(os.path.join(pkg_path, "MainActivity.kt"), "w") as f:
              f.write(kt_code)
          PYEOF

      - name: Compiler l'APK avec Gradle
        run: gradle assembleDebug --no-daemon

      - name: Sauvegarder l'APK dans Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publier le lien direct APK (Release latest)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Dernière version APK
          overwrite_files: true
          files: app/build/outputs/apk/debug/app-debug.apk
